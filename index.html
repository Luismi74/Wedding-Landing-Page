<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e8" />
  <title>Iván & Abigail — Invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="invite-shell">
    <section class="invite-card" aria-labelledby="couple-names">
      <div class="ornate-border" aria-hidden="true">
        <img class="border-piece border-top" src="assets/ornate-border-top.png" alt="" />
        <img class="border-piece border-bottom" src="assets/ornate-border-bottom.png" alt="" />
        <img class="border-piece border-left" src="assets/ornate-border-left.png" alt="" />
        <img class="border-piece border-right" src="assets/ornate-border-right.png" alt="" />
      </div>

      <div class="invite-content">
        <p class="eyebrow reveal delay-1">
          CON EL CORAZÓN LLENO<br />DE ALEGRÍA,
        </p>

        <div class="names reveal delay-2" id="couple-names">
          <span>Iván</span>
          <small>Y</small>
          <span>Abigail</span>
        </div>

        <p class="invitation reveal delay-3">
          LES INVITAMOS A CELEBRAR<br />NUESTRA BODA
        </p>

        <div class="details reveal delay-4">
          <p>
            <strong>22 DE NOVIEMBRE, 2026</strong><br />
            DOMINGO, A LAS 2:00 PM
          </p>

          <p>
            <strong>IGLESIA ADVENTISTA CENTRAL</strong><br />
            SAN PEDRO DE MACORÍS
          </p>
        </div>

        <p class="closing reveal delay-5">Les esperamos con alegría</p>
      </div>
    </section>
  </main>
</body>
</html>
